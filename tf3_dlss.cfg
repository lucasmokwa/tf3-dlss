# ============================================================================
#  TF3-DLSS  -  DLSS / FSR 3.1 for Transport Fever 3
#  Lines starting with # are comments. Most changes apply while the game runs
#  (cfg_live=1); the ones that need a restart say so.
# ============================================================================


# ============================================================================
#  1.  RENDER SIZE
# ============================================================================
#
# The upscaler takes whatever size the game renders at and upscales it to your
# screen. Set that size in the game's own graphics menu with "Resolution scale":
#
#   100%   native       full resolution: best image, no speed-up (DLAA)
#    67%   Quality      (2573x1448 at 4K)
#    58%   Balanced
#    50%   Performance  (1920x1080 at 4K)
#    33%   Ultra Perf
#
# Transport Fever is often limited by the CPU in big late-game cities, where a
# lower render size gains less than you might expect.


# ============================================================================
#  2.  UPSCALER
# ============================================================================

# enabled  -  1 = upscaler on at start, 0 = off (the game's own FSR 1 is used).
# Changes apply as soon as this file is saved, also while playing.
enabled=1

# upscaler  -  which upscaler to use
#
#   auto   DLSS on NVIDIA RTX cards, FSR 3.1 on everything else (default)
#   dlss   DLSS only (NVIDIA RTX 20 series and newer)
#   fsr    FSR 3.1 (any GPU, including NVIDIA)
#   off    neither; same as enabled=0
upscaler=auto

# preset  -  which DLSS model NVIDIA uses (DLSS only)
#
#   11  K  default; best for native and Quality
#   10  J  close to K, slightly less ghosting but more flicker
#   13  M  NVIDIA's default for Performance
#   12  L  NVIDIA's default for Ultra Performance
#    0     let the driver decide
#
# M and L use FP8 maths that only RTX 40/50 cards accelerate; they run slower on
# RTX 20/30. The NVIDIA app's DLSS override, if set for TF3, wins over this.
preset=11

# fsr_color  -  how the game's image is encoded (FSR only). "srgb" (default)
# is right for TF3. Try "linear" only if FSR looks too dark or washed out in
# motion.
fsr_color=srgb

# fsr_version  -  EXPERIMENTAL. Which FSR the mod asks AMD's runtime for
# (FSR only; needs a restart). FSR 4 needs a Radeon that supports it and AMD's Vulkan FSR 4
# runtime in TF3-DLSS\bin, which AMD hasn't published yet; until then this
# makes no difference and FSR 3.1 runs. The log lists the versions offered.
#
#   auto   the newest one AMD's runtime offers for your GPU (default)
#   3      always FSR 3.1
#   4      FSR 4 if offered, otherwise the runtime's default
fsr_version=auto


# ============================================================================
#  3.  IMAGE
# ============================================================================

# sharpness  -  sharpening after DLSS, 0 (off) to 1: a contrast-adaptive pass
# (like AMD CAS). Try 0.2 - 0.4.
sharpness=0.3

# fsr_sharpness  -  sharpening with FSR 3.1, 0 (off) to 1: FSR's own RCAS.
# FSR is softer than DLSS, so this starts higher. Try 0.4 - 0.6.
fsr_sharpness=0.5

# mip_bias  -  texture sharpness (texture LOD bias). The game renders at a
# lower resolution, so the GPU picks blurrier texture levels than your screen
# needs. "auto" = a value for your render scale (log2(scale): -1 at 50%,
# -0.6 at 67%, 0 at 100%). A number sets the bias directly (e.g. -2 for
# sharper ground textures, 0 = off). Lower values make cut-out textures such
# as fences shimmer more.
# Only used while an upscaler runs. Takes effect after restarting the game.
mip_bias=auto


# ============================================================================
#  4.  MOTION
# ============================================================================
# Upscalers combine several frames, so they need to know how everything on
# screen moved. Leave these on unless you are comparing.

# motion_vectors  -  1 = on (default), 0 = none (the image smears when the
# camera moves)
motion_vectors=1

# object_motion  -  1 = also the motion of moving vehicles (trains, cars, ...),
# so they don't leave faint trails behind them. 0 = camera motion only (default
# for now: object motion is off while we look into possible crashes and graphics
# corruption with it on). Set it to 1 to try it; if your frame rate drops in busy
# cities, go back to 0. People and animals get camera motion only either way.
object_motion=0

# jitter  -  1 = tiny sub-pixel camera shifts every frame. The upscaler needs
# these to rebuild fine detail; without them the image stays softer and textures
# can shimmer. 0 = off (default for now: jitter is off while we look into
# possible crashes and graphics corruption with it on). Set it to 1 to try it.
# The jitter_* lines and contour_fix below only matter with jitter=1.
jitter=0

# jitter_phases  -  length of the jitter pattern. 0 = the recommendation for
# your render scale (8 x scale^2: 18 at 67%, 32 at 50%).
jitter_phases=0

# jitter_other_targets  -  1 = jitter 3D drawing into every image the size of
# the game's render, not only the main 3D pass (default). The game draws the
# water's waves into a separate image first, which must line up with the
# jittered water. 0 = main 3D pass only (how 0.2 did it).
jitter_other_targets=1

# jitter_screen_passes  -  0 = don't jitter full-screen effects such as
# reflections, ambient occlusion and bloom (default): they work pixel by pixel
# on images that are already jittered. 1 = jitter them too (how 0.2 did it;
# caused black flicker in water reflections). For comparing only.
jitter_screen_passes=0

# fix_highlight_depth  -  the hover highlight (fill + outline) writes into the
# depth buffer, which gives the ground around a highlighted object the wrong
# motion and makes the upscaler smear it. 1 = stop it writing depth (default).
# Takes effect after restarting the game.
fix_highlight_depth=1

# contour_fix  -  the terrain tool's contour lines are drawn from a copy of the
# depth buffer, using the camera without jitter, so with jitter they jump around
# every frame and flicker. 1 = give them a copy with the jitter taken out
# (default). 0 = the game's own copy, as before (for comparing). Changes apply
# while playing.
contour_fix=1

# reset_distance  -  if the camera moves further than this in one frame
# (metres, e.g. jumping to another city) the upscaler discards its history so
# the old view doesn't ghost into the new one.
reset_distance=1000

# mv_double  -  how the camera motion is calculated. 1 = in double precision on
# the CPU (default): steady even far from the map centre. 0 = the old float
# maths, which tells the upscaler a still image moves by about a tenth of a
# pixel when the camera is several km from the centre. Only for comparing.
mv_double=1


# ============================================================================
#  5.  TROUBLESHOOTING AND DEVELOPMENT
# ============================================================================

# jitter_sign_x / jitter_sign_y (DLSS), fsr_jitter_sign_x / fsr_jitter_sign_y
# (FSR)  -  flip the jitter direction the upscaler is told about. Leave at 1.
# If a STILL camera shows a shaky, fuzzy or "screen door" image with the
# upscaler on (but not off), try -1 on one axis, then both, and report it.
jitter_sign_x=1
jitter_sign_y=1
fsr_jitter_sign_x=1
fsr_jitter_sign_y=1

# mv_scale_x / mv_scale_y  -  multiply the motion vectors. Leave at 1.
# If panning sideways smears but up/down is clean (or the reverse), try -1 on
# that axis and report what fixed it.
mv_scale_x=1
mv_scale_y=1

# debug_keys  -  1 = hotkeys for testing and comparing (all with Ctrl+Shift).
# Off by default, so no key press in game changes the upscaler.
#   D  upscaler on/off (off = the game's own FSR 1, to compare)
#   U  switch between DLSS and FSR 3.1, when both work
#   M  motion vectors: camera + objects -> camera only -> off
#   J  jitter on/off
#   V  debug view: off -> motion vectors -> jitter
#   T  automated camera test, recorded to the mvcap folder
#   Y  automated quick-tilt test, records 8 frames in a row
#   L  log every draw of one frame (which passes are jittered, shader names)
#   O  on-screen info box on/off (see overlay below)
#   Up / Down  sharpness of the running upscaler +0.1 / -0.1 (sharpness or
#              fsr_sharpness)
#   K  jitter sign of the running upscaler (DLSS or FSR): x+y+ -> x-y+ -> x+y- -> x-y-
#   C  save what the terrain contour lines are drawn from (see contour_debug)
# Changes made with these keys last until this file is saved again; write the
# values you like into this file to keep them.
debug_keys=0

# overlay  -  1 = a small info box near the top of the screen: which upscaler
# runs, render and output size, sharpness, jitter (step and sign), motion
# vectors and frames per second. Only shown while DLSS or FSR runs. Ctrl+Shift+O toggles it (with
# debug_keys=1).
overlay=0

# overlay_x / overlay_y  -  where the info box sits: its top-left corner in
# percent of the screen from the left / from the top (0 = left or top edge).
# Move it if it covers the game's own buttons.
overlay_x=25
overlay_y=1

# debug_view  -  draw a debug picture instead of the game:
#   1  motion vectors. Grey = no motion; red/cyan = sideways, green/magenta =
#      up/down. A still camera should be flat grey; panning should tint the
#      whole screen evenly; near things tint more than far ones when moving.
#   2  jitter. The upscaler's input enlarged with blocky pixels, plus a box in
#      the middle of the screen showing one render pixel: grey dots = the
#      jitter pattern, red = offset applied this frame, green = offset the
#      upscaler is told. Red should sit on green. While this view is on,
#      jitter is slowed to one step every 30 frames so you can follow it.
debug_view=0

# debug_scale / debug_object_scale  -  how strongly motion is coloured in the
# motion vector view (colour change per pixel of motion), for the camera and
# for moving objects. Raise them if everything looks grey.
debug_scale=0.05
debug_object_scale=0.05

# object_depth_test  -  debug. 0 = write object motion even where the object is
# hidden behind something (shows whether the object pass draws at all).
object_depth_test=1

# perf  -  1 = measure what the mod costs, to compare settings (upscaler on and
# off, DLSS and FSR, presets, sharpening). Every perf_seconds the log gets a report:
# frame time, the CPU time of the mod's own code per frame (by kind of work, and how
# often the game had to wait for it), and the GPU time of each pass the mod adds
# (motion vectors, the upscaler, sharpening) and of the game's own FSR 1 passes. With
# the info box on (overlay=1) its last line shows the totals. Measuring costs a little
# itself (the report says how much); leave it at 0 for playing.
perf=0

# perf_seconds  -  how many seconds each perf report averages over (1 - 60).
perf_seconds=5

# skip_game_fsr  -  1 = while DLSS or FSR 3.1 runs, don't draw the game's own FSR 1
# passes: the upscaler replaces their image anyway, so this saves their GPU time. If
# the upscaler fails in a frame, that frame may show an old image. Experimental:
# 0 = draw them as before (default).
skip_game_fsr=0

# gpu_crash_info  -  1 = if the GPU crashes (the game says "Device lost error:
# there was a problem with the graphic card"), write to the log which step was
# running on the GPU: one of the mod's passes or the game's own work, and the
# driver's description of the fault. Adds a few markers per frame, so it's off
# by default; turn it on to track down a crash. Needs a restart.
gpu_crash_info=0

# contour_debug  -  1 = save what the terrain tool's contour lines are drawn from,
# to compare (see contour_fix): for 3 frames in a row, the game's own depth copy,
# the mod's copy without jitter and the frame's depth go into a contourcap folder
# next to the log (about 25 MB per frame), and the log says how far apart they
# are. Captures again each time it is switched from 0 to 1 while playing, or with
# Ctrl+Shift+C (debug_keys=1). The game's copy can only be saved if debug_keys=1
# when the game starts. The game pauses for a moment while it captures; off by
# default.
contour_debug=0

# fsr_debug  -  FSR only. 1 = FSR checks its inputs and writes problems to the
# log; 2 = also draws FSR's own debug view. Restart not needed.
fsr_debug=0

# dlss_dev  -  1 = use NVIDIA's developer build of DLSS (bin\dev\nvngx_dlss.dll,
# not included in releases), which draws debug info and adds Ctrl+Alt+F9..F12
# hotkeys. Needs a restart.
dlss_dev=0

# cfg_live  -  1 = re-read this file every second while playing
cfg_live=1

# log_every  -  write a detailed block to the log every N frames (0 = only the
# first few frames). The log is tf3_dlss.log next to this file (or in %TEMP%
# if this folder can't be written to).
log_every=600
