# Builds the layer on every push to main and publishes a GitHub release when the version in
# layer/src/layer.cpp (TF3_DLSS_VERSION) has no release yet. Pull requests get the same build and
# package step, with the zip kept as a workflow artifact instead of a release.
# To release: bump the version (see README, Releasing) and push to main.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VULKAN_SDK_VERSION: 1.4.363.0
  # NVIDIA DLSS SDK tag (https://github.com/NVIDIA/DLSS/tags). Keep it the same as the local SDK.
  DLSS_SDK_REF: v310.9.1

jobs:
  # Cheap Linux check first, so commits that don't change the version don't start a Windows build.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/^#define TF3_DLSS_VERSION "\(.*\)"/\1/p' layer/src/layer.cpp)
          [ -n "$ver" ] || { echo "TF3_DLSS_VERSION not found in layer/src/layer.cpp"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          publish=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if gh release view "v$ver" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release v$ver already exists, nothing to publish."
            else
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $ver, publish=$publish"

  build:
    needs: version
    if: needs.version.outputs.publish == 'true' || github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only the headers and Windows libraries/runtimes of the DLSS SDK (the repo is large).
      - name: Get the NVIDIA DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: _sdk/DLSS
          sparse-checkout: |
            include
            lib/Windows_x86_64
          sparse-checkout-cone-mode: true

      - name: Cache the Vulkan SDK
        id: vk-cache
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.vk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ver = $env:VULKAN_SDK_VERSION
          $exe = Join-Path $env:RUNNER_TEMP 'vulkan_sdk.exe'
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe" -OutFile $exe -UseBasicParsing
          $p = Start-Process $exe -ArgumentList '--root', "C:\VulkanSDK\$ver", '--accept-licenses', '--default-answer', '--confirm-command', 'install' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK install failed (exit $($p.ExitCode))" }

      - name: Build
        shell: pwsh
        run: |
          $env:VULKAN_SDK = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          .\scripts\get_fsr.ps1
          .\scripts\build.ps1 -DlssSdk "$env:GITHUB_WORKSPACE\_sdk\DLSS"

      - name: Package
        shell: pwsh
        run: .\scripts\package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: TF3-DLSS-${{ needs.version.outputs.version }}
          path: dist/TF3-DLSS-${{ needs.version.outputs.version }}.zip

      - name: Publish the release
        if: needs.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$env:VER" "dist\TF3-DLSS-$env:VER.zip" `
            --target $env:GITHUB_SHA --title "TF3-DLSS $env:VER" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed (exit $LASTEXITCODE)" }
